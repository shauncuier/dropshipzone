name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  attestations: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or input
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Validate plugin files
        run: |
          # Check main plugin file exists
          if [ ! -f "product-sync-for-dropshipzone.php" ]; then
            echo "Main plugin file not found!"
            exit 1
          fi
          
          # Check version in main plugin file
          PLUGIN_VERSION=$(grep -m 1 "Version:" product-sync-for-dropshipzone.php | awk '{print $2}')
          echo "Plugin version in file: $PLUGIN_VERSION"

      - name: Create plugin directory structure
        run: |
          mkdir -p build/product-sync-for-dropshipzone
          
          # Copy plugin files (excluding dev files; markdown docs stay repo-only)
          cp -r assets build/product-sync-for-dropshipzone/
          cp -r includes build/product-sync-for-dropshipzone/
          cp -r languages build/product-sync-for-dropshipzone/
          cp product-sync-for-dropshipzone.php build/product-sync-for-dropshipzone/
          cp readme.txt build/product-sync-for-dropshipzone/
          cp LICENSE build/product-sync-for-dropshipzone/
          
          # Remove any development files
          find build -name "*.map" -delete
          find build -name ".DS_Store" -delete
          find build -name "Thumbs.db" -delete
          find build -name "*.ps1" -delete

      - name: Create ZIP archive
        run: |
          cd build
          zip -r ../product-sync-for-dropshipzone-${{ steps.get_version.outputs.version }}.zip product-sync-for-dropshipzone
          cd ..
          ls -la *.zip

      - name: Generate changelog for release
        id: changelog
        run: |
          # Extract changelog for this version from CHANGELOG.md
          VERSION="${{ steps.get_version.outputs.version }}"
          
          # Try to extract version-specific changelog, or use a default message
          if [ -f "CHANGELOG.md" ]; then
            # Extract section for this version (between two version headers)
            CHANGELOG=$(awk "/## \[?$VERSION\]?|## \[?v$VERSION\]?/{flag=1; next} /## \[?[0-9]+\.[0-9]+/{if(flag) exit} flag" CHANGELOG.md)
            
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release version $VERSION of Product Sync for Dropshipzone."
            fi
          else
            CHANGELOG="Release version $VERSION of Product Sync for Dropshipzone."
          fi
          
          # Write to file for multiline output
          echo "$CHANGELOG" > changelog_body.txt
          echo "Generated changelog"

      - name: Delete existing release if exists
        run: |
          # Try to delete existing release (ignore errors if it doesn't exist)
          gh release delete ${{ steps.get_version.outputs.tag_name }} --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Product Sync for Dropshipzone v${{ steps.get_version.outputs.version }}
          body_path: changelog_body.txt
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'rc') }}
          files: |
            product-sync-for-dropshipzone-${{ steps.get_version.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-sync-for-dropshipzone-${{ steps.get_version.outputs.version }}
          path: product-sync-for-dropshipzone-${{ steps.get_version.outputs.version }}.zip
          retention-days: 30
